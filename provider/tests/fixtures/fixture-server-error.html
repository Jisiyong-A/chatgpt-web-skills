<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>ChatGPT — server error</title>
<style>body{font-family:sans-serif;margin:0;}main{max-width:700px;margin:0 auto;padding:20px;}#err{background:#fdecea;border:1px solid #f5c6cb;padding:10px;margin:10px 0;}#composer{min-height:48px;border:1px solid #aaa;border-radius:8px;padding:8px;}</style>
</head>
<body>
<main>
  <div data-testid="conversation">
    <div data-message-author-role="user"><p>hi</p></div>
    <div data-message-author-role="assistant"><p>hello</p></div>
  </div>
  <div id="composer" contenteditable="true" data-placeholder="Message ChatGPT"></div>
  <button data-testid="send-button" aria-disabled="true">Send</button>
</main>
<script>
  const composer = document.getElementById('composer');
  const send = document.querySelector('[data-testid="send-button"]');
  const convo = document.querySelector('[data-testid="conversation"]');
  composer.addEventListener('input', () => { send.setAttribute('aria-disabled', composer.innerText.trim() === '' ? 'true' : 'false'); });
  send.addEventListener('click', () => {
    if (composer.innerText.trim() === '') return;
    const q = composer.innerText.trim();
    composer.innerText = '';
    const um = document.createElement('div');
    um.setAttribute('data-message-author-role', 'user');
    um.innerHTML = '<p>' + q.replace(/</g, '&lt;') + '</p>';
    convo.appendChild(um);
    const err = document.createElement('div');
    err.id = 'err';
    err.textContent = 'Something went wrong, please try again';
    convo.appendChild(err);
  });
</script>
</body>
</html>
