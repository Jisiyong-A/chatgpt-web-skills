<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>ChatGPT — rate limited</title>
<style>body{font-family:sans-serif;margin:0;}#banner{background:#fff3cd;padding:12px;text-align:center;}main{max-width:700px;margin:0 auto;padding:20px;}#composer{min-height:48px;border:1px solid #aaa;border-radius:8px;padding:8px;}</style>
</head>
<body>
<div id="banner"><strong>You've reached your usage limit.</strong> Please try again later.</div>
<main>
  <div data-message-author-role="user"><p>help me write</p></div>
  <div data-message-author-role="assistant"><p>sure</p></div>
  <div id="composer" contenteditable="true" data-placeholder="Message ChatGPT"></div>
  <button data-testid="send-button" disabled>Send</button>
</main>
</body>
</html>
