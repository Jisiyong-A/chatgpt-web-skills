<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>fixture v4 — icon-only submit button (aria-hidden svg, no label text)</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  main { max-width: 800px; margin: 0 auto; padding: 20px; min-height: 90vh; display: flex; flex-direction: column; }
  .conv { flex: 1; }
  .row { padding: 10px; margin: 8px 0; }
  .row[data-message-author-role="user"] { background: #fdf2f2; }
  .row[data-message-author-role="assistant"] { background: #f2fdf2; }
  .dock { border-top: 1px solid #ddd; padding-top: 10px; display: flex; gap: 10px; align-items: flex-end; }
  #composer { flex: 1; min-height: 40px; border: 1px solid #aaa; border-radius: 8px; padding: 6px; }
  #composer:empty::before { content: attr(data-placeholder); color: #aaa; }
  .icon-btn { width: 40px; height: 40px; border-radius: 8px; border: 1px solid #bbb; background: #fff; }
</style></head>
<body>
<main>
  <div class="conv" id="conv">
    <div class="row" data-message-author-role="user"><p>is it warm?</p></div>
    <div class="row" data-message-author-role="assistant"><p>depends</p></div>
  </div>
  <div class="dock">
    <div id="composer" contenteditable="true" data-placeholder="Type a message"></div>
    <button class="icon-btn" id="send-icon" aria-label="Send message" aria-disabled="true">
      <svg width="18" height="18" aria-hidden="true"><path d="M2 16 L18 8 L2 0 L2 6 L10 8 L2 10 Z" fill="currentColor"/></svg>
    </button>
  </div>
</main>
<script>
  const composer = document.getElementById('composer');
  const btn = document.getElementById('send-icon');
  const conv = document.getElementById('conv');
  composer.addEventListener('input', () => {
    btn.setAttribute('aria-disabled', composer.innerText.trim() === '' ? 'true' : 'false');
  });
  btn.addEventListener('click', () => {
    if (composer.innerText.trim() === '' || btn.getAttribute('aria-disabled') === 'true') return;
    const q = composer.innerText.trim();
    composer.innerText = '';
    btn.setAttribute('aria-disabled', 'true');
    const um = document.createElement('div');
    um.className = 'row';
    um.setAttribute('data-message-author-role', 'user');
    um.innerHTML = '<p>' + q.replace(/</g, '&lt;') + '</p>';
    conv.appendChild(um);
    const stop = document.createElement('button');
    stop.setAttribute('data-testid', 'stop-button');
    stop.textContent = 'Stop';
    document.body.appendChild(stop);
    setTimeout(() => {
      const am = document.createElement('div');
      am.className = 'row';
      am.setAttribute('data-message-author-role', 'assistant');
      am.innerHTML = '<p>fixture-v4 response to: ' + q.replace(/</g, '&lt;') + '</p>';
      conv.appendChild(am);
      stop.remove();
    }, 850);
  });
</script>
</body>
</html>
