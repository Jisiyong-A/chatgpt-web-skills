<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>ChatGPT — two ambiguous composers</title>
<style>body{font-family:sans-serif;margin:0;}main{max-width:700px;margin:0 auto;padding:20px;min-height:90vh;display:flex;flex-direction:column;justify-content:flex-end;}.composer{min-height:48px;border:1px solid #aaa;border-radius:8px;padding:8px;margin:6px 0;}.composer:empty::before{content:attr(data-placeholder);color:#aaa;}</style>
</head>
<body>
<main>
  <div data-message-author-role="user"><p>hi</p></div>
  <div data-message-author-role="assistant"><p>hello</p></div>
  <div class="composer" id="c1" contenteditable="true" data-placeholder="Message ChatGPT"></div>
  <div class="composer" id="c2" contenteditable="true" data-placeholder="Message ChatGPT"></div>
  <button data-testid="send-button" aria-disabled="true">Send</button>
</main>
</body>
</html>
